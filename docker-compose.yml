services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fieldtask
      MYSQL_USER: fieldtask
      MYSQL_PASSWORD: fieldtask_demo
      MYSQL_ROOT_PASSWORD: root_demo_only
    ports:
      - "3307:3306"
    volumes:
      - fieldtask_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufieldtask", "-pfieldtask_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fieldtask?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: fieldtask
      DB_PASSWORD: fieldtask_demo
    ports:
      - "8080:8080"
    volumes:
      - fieldtask_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  fieldtask_mysql:
  fieldtask_uploads:
